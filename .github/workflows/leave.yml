name: gp-leave
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Which Telethon account scans/leaves"
        required: true
        type: choice
        options:
          - CH
          - JL
          - HHNC
          - NAWTHON
          - NKST_NADI
        default: CH
      mode:
        description: "scan (read-only check), leave (actually leave confirmed groups), or status (read-only group-count snapshot for /account_status)"
        required: true
        type: choice
        options:
          - scan
          - leave
          - status
        default: scan
      scan_id:
        description: "leave_scans.id this run belongs to (set by the Worker)"
        required: true
        type: string
      scope:
        description: "leave mode only (set by the Worker): all = muted/read-only/paid/<50 (original Yes), rvp = read-only + view-only channels + paid (never muted)"
        required: false
        type: choice
        options:
          - all
          - rvp
        default: all

# Phase 8 (2026-09-23): deliberately the SAME group as join.yml, not a
# separate "telegram-leave-*" one. GitHub's concurrency scope is repo-wide,
# not per-workflow -- reusing join.yml's group name means a leave run and a
# join run for the SAME account can never execute at the same time, which is
# exactly the "one session, one IP at a time" guarantee this feature needs
# (see join.yml's own concurrency comment for the full reasoning). This is
# on top of, not instead of, the Worker's leave:running:{account} KV flag
# (dispatchNextQueuedJoinForAccount) -- same defense-in-depth pattern as
# join.yml: app-level pause here, GitHub-enforced guarantee as the backstop.
concurrency:
  group: telegram-join-${{ inputs.account }}
  cancel-in-progress: false

jobs:
  leave:
    runs-on: ubuntu-latest
    # scan is fast; leave is the ~10-15min phase per the estimate this was
    # sized against. 20 min gives a safety margin either way.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon

      - name: Scan or leave muted groups
        env:
          # Every account's secrets are passed in; scripts/tg_accounts.py picks the
          # set matching ACCOUNT and fails loudly if any is missing (a workflow
          # `a && b || c` chain would silently fall back to CH's credentials).
          CH_TG_API_ID: ${{ secrets.CH_TG_API_ID }}
          CH_TG_API_HASH: ${{ secrets.CH_TG_API_HASH }}
          CH_TG_SESSION_STRING: ${{ secrets.CH_TG_SESSION_STRING }}
          JL_API_ID: ${{ secrets.JL_API_ID }}
          JL_API_HASH: ${{ secrets.JL_API_HASH }}
          JL_STRING_SESSION: ${{ secrets.JL_STRING_SESSION }}
          HHNC_API_ID: ${{ secrets.HHNC_API_ID }}
          HHNC_API_HASH: ${{ secrets.HHNC_API_HASH }}
          HHNC_TG_SESSION: ${{ secrets.HHNC_TG_SESSION }}
          NAWTHON_API_ID: ${{ secrets.NAWTHON_API_ID }}
          NAWTHON_API_HASH: ${{ secrets.NAWTHON_API_HASH }}
          NAWTHON_TG_SESSION: ${{ secrets.NAWTHON_TG_SESSION }}
          NKST_NADI_API_ID: ${{ secrets.NKST_NADI_API_ID }}
          NKST_NADI_API_HASH: ${{ secrets.NKST_NADI_API_HASH }}
          NKST_NADI_STRING_SESSION: ${{ secrets.NKST_NADI_STRING_SESSION }}
          ACCOUNT: ${{ inputs.account }}
          MODE: ${{ inputs.mode }}
          SCAN_ID: ${{ inputs.scan_id }}
          SCOPE: ${{ inputs.scope }}
          REPORT_URL: ${{ secrets.WORKER_REPORT_URL }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: python scripts/leave_groups.py
