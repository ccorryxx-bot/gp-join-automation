name: gp-join
on:
  workflow_dispatch:
    inputs:
      group_url:
        required: true
        type: string
      queue_id:
        required: true
        type: string

# Defense-in-depth alongside the Worker's own in-flight check
# (dispatchNextQueuedJoin refuses to dispatch while a join_queue row is
# 'triggered' in D1). That's app-level logic in a Worker; this is a
# GitHub-enforced guarantee that catches what the Worker check can't --
# e.g. someone manually re-running this workflow from the Actions tab while
# an automated run triggered by the dispatcher is already going.
#
# Fixed group name (NOT per-queue_id) is deliberate: the whole point is that
# every run of this workflow shares one lane, so at most one join is ever
# actually executing no matter how many workflow_dispatch calls land. If a
# second Telethon account is added later (see README's CH_/ACC2_ prefix
# convention), split this into a per-account group instead -- e.g.
# `group: telegram-join-${{ inputs.account_prefix }}` -- so two different
# accounts can join in parallel without blocking each other unnecessarily.
concurrency:
  group: telegram-join-CH
  # NEVER true here. Cancelling an in-progress run mid-join can leave
  # Telethon in an inconsistent state -- e.g. ImportChatInviteRequest already
  # sent to Telegram but the process killed before the /report call fires --
  # which permanently strands that join_queue row at 'triggered' until the
  # 15-min stale sweep, and the join may or may not have actually gone
  # through on Telegram's side with no way to tell from here. `false` queues
  # the new run instead: it waits for the current one to finish normally,
  # then runs. Non-destructive, and matches "one at a time" exactly.
  cancel-in-progress: false

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon

      - name: Join Telegram group
        env:
          TG_API_ID: ${{ secrets.CH_TG_API_ID }}
          TG_API_HASH: ${{ secrets.CH_TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.CH_TG_SESSION_STRING }}
          GROUP_URL: ${{ inputs.group_url }}
          QUEUE_ID: ${{ inputs.queue_id }}
          REPORT_URL: ${{ secrets.WORKER_REPORT_URL }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: python scripts/join_telegram.py
