name: gp-join
on:
  workflow_dispatch:
    inputs:
      group_url:
        required: true
        type: string
      queue_id:
        required: true
        type: string
      account:
        description: "Which Telethon account joins this group"
        required: true
        type: choice
        options:
          - CH
          - JL
          - HHNC
          - NAWTHON
        default: CH

# Defense-in-depth alongside the Worker's own in-flight check
# (dispatchNextQueuedJoinForAccount refuses to dispatch for an account while
# one of its join_queue rows is 'triggered' in D1). That's app-level logic
# in a Worker; this is a GitHub-enforced guarantee that catches what the
# Worker check can't -- e.g. someone manually re-running this workflow from
# the Actions tab while an automated run triggered by the dispatcher is
# already going.
#
# Phase 7 (2026-09-22): per-account group, as this comment originally
# predicted -- every account (CH / JL / HHNC / NAWTHON) gets its own lane, so
# a run for one account is queued behind that SAME account's in-progress run,
# but never blocks the other accounts from joining in parallel.
concurrency:
  group: telegram-join-${{ inputs.account }}
  # NEVER true here. Cancelling an in-progress run mid-join can leave
  # Telethon in an inconsistent state -- e.g. ImportChatInviteRequest already
  # sent to Telegram but the process killed before the /report call fires --
  # which permanently strands that join_queue row at 'triggered' until the
  # 15-min stale sweep, and the join may or may not have actually gone
  # through on Telegram's side with no way to tell from here. `false` queues
  # the new run instead: it waits for the current one to finish normally,
  # then runs. Non-destructive, and matches "one at a time" exactly.
  cancel-in-progress: false

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon

      - name: Join Telegram group
        env:
          # Every account's secrets are passed in; scripts/tg_accounts.py picks the
          # set matching ACCOUNT and fails loudly if any is missing (a workflow
          # `a && b || c` chain would silently fall back to CH's credentials).
          CH_TG_API_ID: ${{ secrets.CH_TG_API_ID }}
          CH_TG_API_HASH: ${{ secrets.CH_TG_API_HASH }}
          CH_TG_SESSION_STRING: ${{ secrets.CH_TG_SESSION_STRING }}
          JL_API_ID: ${{ secrets.JL_API_ID }}
          JL_API_HASH: ${{ secrets.JL_API_HASH }}
          JL_STRING_SESSION: ${{ secrets.JL_STRING_SESSION }}
          HHNC_API_ID: ${{ secrets.HHNC_API_ID }}
          HHNC_API_HASH: ${{ secrets.HHNC_API_HASH }}
          HHNC_TG_SESSION: ${{ secrets.HHNC_TG_SESSION }}
          NAWTHON_API_ID: ${{ secrets.NAWTHON_API_ID }}
          NAWTHON_API_HASH: ${{ secrets.NAWTHON_API_HASH }}
          NAWTHON_TG_SESSION: ${{ secrets.NAWTHON_TG_SESSION }}
          ACCOUNT: ${{ inputs.account }}
          GROUP_URL: ${{ inputs.group_url }}
          QUEUE_ID: ${{ inputs.queue_id }}
          REPORT_URL: ${{ secrets.WORKER_REPORT_URL }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: python scripts/join_telegram.py
