name = "gp-join-automation"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# ── D1: queue + dedup history ──
[[d1_databases]]
binding = "DB"
database_name = "gp-join-queue-db"
database_id = "23e72f68-d0b7-40ed-aa38-85b8ddd2a760"

# ── KV: Telegram update_id short-TTL dedup ──
[[kv_namespaces]]
binding = "DEDUP_KV"
id = "4e2d56caaddc44ac958c3c229a43e164"

# ── Cron: dispatcher tick (Phase 3) ──
[triggers]
crons = ["*/1 * * * *"]  # every 1 min; dispatcher pops exactly 1 queued row/tick = ~60s natural pacing

# ── Plain vars (not secret — just a numeric Telegram user ID) ──
# Phase 7 (2026-09-22): every message/command/callback this bot accepts is
# gated on this ID (see isAdmin() in src/worker.js). Anyone else is
# silently ignored.
[vars]
ADMIN_TG_ID = "7699538187"

# Secrets (set via `wrangler secret put`, NOT here):
#   TG_BOT_TOKEN        - Telegram Bot API token
#   TG_WEBHOOK_SECRET   - secret_token for webhook spoof protection
#   GH_PAT              - GitHub PAT with `workflow` scope (repo dispatch trigger)
#
# Phase 7 note: the JL account's Telethon credentials (JL_API_ID,
# JL_API_HASH, JL_STRING_SESSION) are GitHub Actions secrets, NOT Cloudflare
# Worker secrets — join.yml uses them directly, the Worker never sees them.
